# SQL Server en contenedor para desarrollo, pruebas end-to-end y CI.
# En QA y producción la base es un servidor externo y este archivo no se usa.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      # La imagen de SQL Server exige aceptar la licencia de Microsoft.
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Definir MSSQL_SA_PASSWORD en .env}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    mem_limit: 3g
    ports:
      # Solo localhost, para conectarse con SSMS / Azure Data Studio: localhost,14330
      - "127.0.0.1:${DB_HOST_PORT:-14330}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  # Crea la base de la aplicación, la de pruebas y el login de aplicación (idempotente).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    entrypoint: ["/bin/bash", "/init/init-db.sh"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_NAME: ${DB_NAME:-planiq}
      DB_USER: ${DB_USER:?Definir DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
    volumes:
      - ./sqlserver/init:/init:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  migrate:
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  sqlserver-data:
