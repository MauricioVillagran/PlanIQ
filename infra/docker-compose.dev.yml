# Agregados de desarrollo sobre docker-compose.yml + docker-compose.db.yml:
# recarga en caliente, herramientas de prueba en la imagen de la API y archivos reales de grader en solo lectura.

services:
  api:
    environment:
      # Docker Desktop no propaga eventos de archivos desde Windows: la recarga usa polling.
      WATCHFILES_FORCE_POLLING: "true"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/workspace/api/app"]
    # Imagen con herramientas de desarrollo (pytest, ruff, mypy): `docker compose exec api pytest`.
    image: planiq-api:dev
    build:
      args:
        DEV_DEPS: "true"
    volumes:
      - ../api:/workspace/api
      - ../worker/worker:/workspace/worker/worker
      - ../pyproject.toml:/workspace/pyproject.toml:ro

  migrate:
    image: planiq-api:dev
    build:
      args:
        DEV_DEPS: "true"
    volumes:
      - ../api:/workspace/api

  worker:
    volumes:
      - ../api/app:/workspace/api/app
      - ../worker/worker:/workspace/worker/worker
      # Archivos reales de grader: solo lectura y solo en desarrollo.
      - ../cargaExcel:/data/cargaExcel:ro

  web:
    # Nombre propio para que el build de producción (target runner) no reemplace la imagen de desarrollo.
    image: planiq-web:dev
    build:
      target: dev
    # Turbopack no detecta cambios en volúmenes montados desde Windows; webpack sí, con polling.
    command: ["npx", "next", "dev", "--webpack", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ../web/src:/app/src
