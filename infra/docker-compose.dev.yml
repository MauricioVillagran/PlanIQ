# Agregados de desarrollo sobre docker-compose.yml:
# SQL Server en contenedor, creación de la base, recarga en caliente y archivos reales de grader en solo lectura.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      # La imagen de SQL Server exige aceptar la licencia de Microsoft.
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Definir MSSQL_SA_PASSWORD en .env}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    mem_limit: 3g
    ports:
      # Solo localhost, para conectarse con SSMS / Azure Data Studio: localhost,14330
      - "127.0.0.1:${DB_HOST_PORT:-14330}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    entrypoint: ["/bin/bash", "/init/init-db.sh"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_NAME: ${DB_NAME:-planiq}
      DB_USER: ${DB_USER:?Definir DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
    volumes:
      - ./sqlserver/init:/init:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    environment:
      # Docker Desktop no propaga eventos de archivos desde Windows: la recarga usa polling.
      WATCHFILES_FORCE_POLLING: "true"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/workspace/api/app"]
    # Imagen con herramientas de desarrollo (pytest, ruff, mypy): `docker compose exec api pytest`.
    image: planiq-api:dev
    build:
      args:
        DEV_DEPS: "true"
    volumes:
      - ../api:/workspace/api
      - ../worker/worker:/workspace/worker/worker
      - ../pyproject.toml:/workspace/pyproject.toml:ro

  migrate:
    image: planiq-api:dev
    build:
      args:
        DEV_DEPS: "true"
    volumes:
      - ../api:/workspace/api
    depends_on:
      db-init:
        condition: service_completed_successfully

  worker:
    volumes:
      - ../api/app:/workspace/api/app
      - ../worker/worker:/workspace/worker/worker
      # Archivos reales de grader: solo lectura y solo en desarrollo.
      - ../cargaExcel:/data/cargaExcel:ro

  web:
    # Nombre propio para que el build de producción (target runner) no reemplace la imagen de desarrollo.
    image: planiq-web:dev
    build:
      target: dev
    # Turbopack no detecta cambios en volúmenes montados desde Windows; webpack sí, con polling.
    command: ["npx", "next", "dev", "--webpack", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ../web/src:/app/src

volumes:
  sqlserver-data:
