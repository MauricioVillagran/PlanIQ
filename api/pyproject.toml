[project]
name = "planiq-api"
version = "0.1.0"
description = "API de PlanIQ"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pyodbc==5.3.0",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.16.0",
    "ruff==0.17.3",
    "mypy==2.4.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requiere SQL Server (base de test)",
]
addopts = "-ra --strict-markers"
